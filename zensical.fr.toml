# Documentation de HGPM, en français : https://jm2k69.github.io/PSGPOTools/fr/
# La version anglaise est zensical.toml ; les deux sont construites par .github/workflows/docs.yml.

[project]
site_name = "HGPM"
site_description = "Console de gestion des stratégies de groupe pour Samba AD et Active Directory, sous Windows et Linux, en PowerShell 7 et Avalonia."
site_author = "JM2K69"
site_url = "https://jm2k69.github.io/PSGPOTools/fr/"
copyright = "&copy; JM2K69 and the HGPM contributors"
repo_url = "https://github.com/JM2K69/PSGPOTools"
repo_name = "JM2K69/PSGPOTools"
# La branche des liens « Modifier » : master, où se fait le travail.
edit_uri = "edit/master/docs/fr/"
docs_dir = "docs/fr"
site_dir = "site/fr"

nav = [
  { "Accueil" = "index.md" },
  { "Prise en main" = [
    "getting-started/installation.md",
    "getting-started/offline.md",
    "getting-started/first-steps.md",
    "getting-started/lab.md",
    "getting-started/production.md",
  ] },
  { "Fonctionnalités" = [
    "features/launcher.md",
    # A section for each console of the launcher (Start-HGPM), then its tools, in the order of its tiles.
