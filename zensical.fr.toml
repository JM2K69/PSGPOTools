# Documentation de PSGPOTools, en français : https://jm2k69.github.io/PSGPOTools/fr/
# La version anglaise est zensical.toml ; les deux sont construites par .github/workflows/docs.yml.

[project]
site_name = "PSGPOTools"
site_description = "Console de gestion des stratégies de groupe pour Samba AD et Active Directory, sous Windows et Linux, en PowerShell 7 et Avalonia."
site_author = "JM2K69"
site_url = "https://jm2k69.github.io/PSGPOTools/fr/"
copyright = "&copy; JM2K69 and the PSGPOTools contributors"
repo_url = "https://github.com/JM2K69/PSGPOTools"
repo_name = "JM2K69/PSGPOTools"
# La branche des liens « Modifier » : avalonia jusqu’à sa fusion dans la branche principale, puis celle-ci.
edit_uri = "edit/avalonia/docs/fr/"
docs_dir = "docs/fr"
site_dir = "site/fr"

nav = [
  { "Accueil" = "index.md" },
  { "Prise en main" = [
    "getting-started/installation.md",
    "getting-started/first-steps.md",
    "getting-started/lab.md",
  ] },
  { "Fonctionnalités" = [
    "features/console.md",
    "features/gpo-management.md",
    "features/policy-editor.md",
    "features/preferences.md",
    "features/backup-history.md",
    "features/configuration.md",
    "features/delegation.md",
  ] },
  { "Workflows" = [
    "workflows/index.md",
    "workflows/create-and-link.md",
    "workflows/backup-and-restore.md",
    "workflows/recycle-bin-and-templates.md",
    "workflows/drift.md",
    "workflows/approval.md",
    "workflows/import-and-migrate.md",
  ] },
  { "Technique" = [
    "technical/architecture.md",
    "technical/ldap.md",
    "technical/sysvol.md",
    "technical/security-descriptors.md",
    "technical/file-formats.md",
    "technical/user-interface.md",
    "technical/tests.md",
  ] },
  { "Référence" = [
    "reference/commands.md",
    # The pages of the commands, written by CI/Update-CommandReference.ps1.
    { "Commandes" = [
      "reference/commands/approve-psgpo.md",
      "reference/commands/backup-psgpo.md",
      "reference/commands/compare-psgpobackup.md",
      "reference/commands/get-psgpoauditlog.md",
      "reference/commands/get-psgpobackup.md",
      "reference/commands/get-psgpocategory.md",
      "reference/commands/get-psgpoconfiguration.md",
      "reference/commands/get-psgpodirectory.md",
      "reference/commands/get-psgpodrift.md",
      "reference/commands/get-psgpogpmcbackup.md",
      "reference/commands/get-psgpomigrationentry.md",
      "reference/commands/get-psgpomigrationtable.md",
      "reference/commands/get-psgpopermission.md",
      "reference/commands/get-psgpopolicy.md",
      "reference/commands/get-psgposupportedon.md",
      "reference/commands/get-psgpowmifilter.md",
      "reference/commands/import-psgpo.md",
      "reference/commands/import-psgpodirectory.md",
      "reference/commands/initialize-psgpoadmx.md",
      "reference/commands/initialize-psgpoworkflow.md",
      "reference/commands/new-psgpo.md",
      "reference/commands/new-psgpolink.md",
      "reference/commands/new-psgpomigrationtable.md",
      "reference/commands/new-psgpowmifilter.md",
      "reference/commands/remove-psgpo.md",
      "reference/commands/remove-psgpolink.md",
      "reference/commands/remove-psgpowmifilter.md",
      "reference/commands/restore-psgpo.md",
      "reference/commands/set-psgpo.md",
      "reference/commands/set-psgpobackup.md",
      "reference/commands/set-psgpoinheritance.md",
      "reference/commands/set-psgpolink.md",
      "reference/commands/set-psgpopermission.md",
      "reference/commands/show-gpomanageravalonia.md",
    ] },
    "reference/configuration.md",
  ] },
  # Fait depuis CHANGELOG.md par .github/workflows/docs.yml, avec la version du module.
  { "Historique des versions" = "changelog.md" },
]

[project.extra]
alternate = [
  { name = "English", link = "https://jm2k69.github.io/PSGPOTools/en/", lang = "en" },
  { name = "Français", link = "https://jm2k69.github.io/PSGPOTools/fr/", lang = "fr" },
]

[project.theme]
language = "fr"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
