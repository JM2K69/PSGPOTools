name: Documentation

# The documentation site (Zensical), in English and in French, published on GitHub Pages:
# <site>/en/ and <site>/fr/, the root sending to the English one. The repository must publish
# GitHub Pages with GitHub Actions (Settings > Pages > Build and deployment > GitHub Actions).
on:
  push:
    branches: [main, master, avalonia]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'zensical.fr.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical

      # The screenshots are kept once, in docs/assets: each language gets a copy.
      - name: Share the assets
        run: |
          cp -r docs/assets docs/en/assets
          cp -r docs/assets docs/fr/assets

      - name: Build the English site
        run: zensical build --clean
      - name: Build the French site
        run: zensical build --clean --config-file zensical.fr.toml

      # The root of the site sends to the English documentation.
      - name: Root page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>PSGPOTools</title>
            <meta http-equiv="refresh" content="0; url=en/">
            <link rel="canonical" href="en/">
          </head>
          <body><a href="en/">PSGPOTools documentation</a> - <a href="fr/">documentation en français</a></body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
