name: Release

# Publishes the module on the PowerShell Gallery, only for a tag of a version (v0.1.3-alpha): the
# commits of the branches run the tests (CI), never a publication. What is published is the module
# the tests ran (the artifact of the build job of the CI), never a build of its own.
on:
  push:
    tags: ['v*']

# Nothing by default: each job says what it needs.
permissions: {}

jobs:
  tests:
    # Every test of the CI, on the tagged commit: nothing is published if one fails.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: tests
    # Windows: Authenticode signatures and catalogs (when the certificate is given).
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # The release of GitHub and its files.
      contents: write
      # The attestation of the files of the release (artifact attestations, Sigstore).
      id-token: write
      attestations: write
    # The secrets PSGALLERY_API_KEY, CODE_SIGNING_PFX and CODE_SIGNING_PASSWORD are secrets of this
    # environment: its protection rules (a reviewer to approve, the tags allowed) apply before they
    # are given.
    environment:
      name: psgallery
      url: https://www.powershellgallery.com/packages/HGPM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the module the tests ran
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: module
          path: HGPM

      - name: Check the version and the API key
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'No secret PSGALLERY_API_KEY in the environment psgallery: create it (Settings > Environments > psgallery) with an API key of the PowerShell Gallery.' }
          # The tag, the manifest, the section of CHANGELOG.md and the gallery; the notes of the release.
          ./CI/04_Publish.ps1 -Tag '${{ github.ref_name }}' -NotesPath "$env:RUNNER_TEMP/notes.md"

      - name: Make the packages (signed when the certificate is given)
        shell: pwsh
        env:
          CODE_SIGNING_PFX: ${{ secrets.CODE_SIGNING_PFX }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        run: |
          $sign = @{}
          $pfx = $null
          if ($env:CODE_SIGNING_PFX) {
              $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
              [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGNING_PFX))
              $sign = @{ CertificatePath = $pfx; CertificatePassword = (ConvertTo-SecureString -String $env:CODE_SIGNING_PASSWORD -AsPlainText -Force) }
          } else {
              Write-Host '::notice::No secret CODE_SIGNING_PFX: the module is not signed with Authenticode (SHA256SUMS and the attestation of the release prove where it comes from).'
          }
          try {
              ./CI/05_Package.ps1 -OutputPath "$env:RUNNER_TEMP/release" @sign
          } finally {
              if ($pfx) { Remove-Item -LiteralPath $pfx -Force }
          }

      - name: Attest the files of the release
        # gh attestation verify <file> --repo JM2K69/PSGPOTools: built by this workflow, from this tag.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS

      - name: Publish on the PowerShell Gallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: ./CI/04_Publish.ps1 -Tag '${{ github.ref_name }}' -ApiKey $env:PSGALLERY_API_KEY -PackagePath "$env:RUNNER_TEMP/release/HGPM"

      - name: Create the release of GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $release = "$env:RUNNER_TEMP/release"
          $files = @(Get-ChildItem -LiteralPath $release -Filter '*.zip' | ForEach-Object FullName) + "$release/SHA256SUMS"
          $arguments = @('release', 'create', $tag, '--title', "HGPM $tag", '--notes-file', "$env:RUNNER_TEMP/notes.md")
          if ($tag -like '*-*') { $arguments += '--prerelease' }
          gh @arguments @files
          if ($LASTEXITCODE) { throw "gh release create failed ($LASTEXITCODE)." }
