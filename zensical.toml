      "reference/commands/remove-psgpobackup.md",
      "reference/commands/remove-psgpofinegrainedpasswordpolicy.md",
      "reference/commands/remove-psgpofinegrainedpasswordpolicysubject.md",
      "reference/commands/remove-psgpolink.md",
      "reference/commands/remove-psgpowmifilter.md",
