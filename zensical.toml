# Documentation of PSGPOTools, in English: https://jm2k69.github.io/PSGPOTools/en/
# The French one is zensical.fr.toml. Both are built by .github/workflows/docs.yml, which also
# copies docs/assets (the screenshots, shared) into each of them:
#   zensical build --clean                          (docs/en -> site/en)
#   zensical build --clean -f zensical.fr.toml      (docs/fr -> site/fr)

[project]
site_name = "PSGPOTools"
site_description = "Group Policy management console for Samba AD and Active Directory, on Windows and Linux, in PowerShell 7 and Avalonia."
site_author = "JM2K69"
site_url = "https://jm2k69.github.io/PSGPOTools/en/"
copyright = "&copy; JM2K69 and the PSGPOTools contributors"
repo_url = "https://github.com/JM2K69/PSGPOTools"
repo_name = "JM2K69/PSGPOTools"
# The branch of the "Edit" links: avalonia until it is merged into the main branch, then that one.
edit_uri = "edit/avalonia/docs/en/"
docs_dir = "docs/en"
site_dir = "site/en"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/first-steps.md",
    "getting-started/lab.md",
  ] },
  { "Features" = [
    "features/console.md",
    "features/gpo-management.md",
    "features/policy-editor.md",
    "features/preferences.md",
    "features/backup-history.md",
    "features/configuration.md",
    "features/delegation.md",
  ] },
  { "Workflows" = [
    "workflows/index.md",
    "workflows/create-and-link.md",
    "workflows/backup-and-restore.md",
    "workflows/recycle-bin-and-templates.md",
    "workflows/drift.md",
    "workflows/approval.md",
    "workflows/import-and-migrate.md",
  ] },
  { "Technical" = [
    "technical/architecture.md",
    "technical/ldap.md",
    "technical/sysvol.md",
    "technical/security-descriptors.md",
    "technical/file-formats.md",
    "technical/user-interface.md",
    "technical/tests.md",
  ] },
  { "Reference" = [
    "reference/commands.md",
    "reference/configuration.md",
  ] },
  # Made from CHANGELOG.md by .github/workflows/docs.yml, with the version of the module.
  { "Changelog" = "changelog.md" },
]

[project.extra]
alternate = [
  { name = "English", link = "https://jm2k69.github.io/PSGPOTools/en/", lang = "en" },
  { name = "Français", link = "https://jm2k69.github.io/PSGPOTools/fr/", lang = "fr" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
