# Documentation of HGPM, in English: https://jm2k69.github.io/PSGPOTools/en/
# The French one is zensical.fr.toml. Both are built by .github/workflows/docs.yml, which also
# copies docs/assets (the screenshots, shared) into each of them:
#   zensical build --clean                          (docs/en -> site/en)
#   zensical build --clean -f zensical.fr.toml      (docs/fr -> site/fr)

[project]
site_name = "HGPM"
site_description = "Group Policy management console for Samba AD and Active Directory, on Windows and Linux, in PowerShell 7 and Avalonia."
site_author = "JM2K69"
site_url = "https://jm2k69.github.io/PSGPOTools/en/"
copyright = "&copy; JM2K69 and the HGPM contributors"
repo_url = "https://github.com/JM2K69/PSGPOTools"
repo_name = "JM2K69/PSGPOTools"
# The branch of the "Edit" links: master, where the work happens.
edit_uri = "edit/master/docs/en/"
docs_dir = "docs/en"
site_dir = "site/en"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/first-steps.md",
    "getting-started/lab.md",
  ] },
  { "Features" = [
    "features/launcher.md",
    # A section for each console of the launcher (Start-HGPM), then its tools, in the order of its tiles.
    { "Group Policy Management" = [
      "features/console.md",
      "features/gpo-management.md",
      "features/policy-editor.md",
      "features/preferences.md",
      "features/wmi-filters-and-linux.md",
      "features/backup-history.md",
      "features/delegation.md",
      "features/configuration.md",
    ] },
    { "Password Settings" = [
      "features/password-policies.md",
    ] },
    # The tools of the launcher that are not consoles of the domain.
    { "Tools" = [
      "features/wmi-filter-creator.md",
      "features/policy-analyzer.md",
      "features/audit-log.md",
    ] },
  ] },
  { "Workflows" = [
    "workflows/index.md",
    "workflows/create-and-link.md",
    "workflows/backup-and-restore.md",
    "workflows/recycle-bin-and-templates.md",
    "workflows/drift.md",
    "workflows/approval.md",
    "workflows/import-and-migrate.md",
    "workflows/password-policies.md",
  ] },
  { "Technical" = [
    "technical/architecture.md",
    "technical/ldap.md",
    "technical/sysvol.md",
    "technical/security-descriptors.md",
    "technical/file-formats.md",
    "technical/user-interface.md",
    "technical/tests.md",
  ] },
  { "Reference" = [
    "reference/commands.md",
    # The pages of the commands, written by CI/Update-CommandReference.ps1.
    { "Commands" = [
      "reference/commands/add-psgpofinegrainedpasswordpolicysubject.md",
      "reference/commands/approve-psgpo.md",
      "reference/commands/backup-psgpo.md",
      "reference/commands/compare-psgpobackup.md",
      "reference/commands/compare-psgpopolicyruleset.md",
      "reference/commands/export-psgpopolicyrulecomparison.md",
      "reference/commands/export-psgpopolicyruleset.md",
      "reference/commands/export-psgpowmifilter.md",
      "reference/commands/get-psgpoauditlog.md",
      "reference/commands/get-psgpobackup.md",
      "reference/commands/get-psgpocategory.md",
      "reference/commands/get-psgpoconfiguration.md",
      "reference/commands/get-psgpodefaultpasswordpolicy.md",
      "reference/commands/get-psgpodirectory.md",
      "reference/commands/get-psgpodrift.md",
      "reference/commands/get-psgpofinegrainedpasswordpolicy.md",
      "reference/commands/get-psgpogpmcbackup.md",
      "reference/commands/get-psgpomigrationentry.md",
      "reference/commands/get-psgpomigrationtable.md",
      "reference/commands/get-psgpopermission.md",
      "reference/commands/get-psgpopolicy.md",
      "reference/commands/get-psgpopolicyruleset.md",
      "reference/commands/get-psgporesultantpasswordpolicy.md",
      "reference/commands/get-psgposupportedon.md",
      "reference/commands/get-psgpowmifilter.md",
      "reference/commands/get-psgpowmifilterpermission.md",
      "reference/commands/get-psgpowmiquerytemplate.md",
      "reference/commands/import-psgpo.md",
      "reference/commands/import-psgpoauditlog.md",
      "reference/commands/import-psgpodirectory.md",
      "reference/commands/import-psgpopolicyruleset.md",
      "reference/commands/import-psgpowmifilter.md",
      "reference/commands/initialize-psgpoadmx.md",
      "reference/commands/initialize-psgpoauditshare.md",
      "reference/commands/initialize-psgpoworkflow.md",
      "reference/commands/install-psgpoadmx.md",
      "reference/commands/new-psgpo.md",
      "reference/commands/new-psgpofinegrainedpasswordpolicy.md",
      "reference/commands/new-psgpolink.md",
      "reference/commands/new-psgpomigrationtable.md",
      "reference/commands/new-psgpowmifilter.md",
