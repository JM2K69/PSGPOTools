      "reference/commands/test-psgpowmifilter.md",
    ] },
    "reference/configuration.md",
  ] },
  # Made from CHANGELOG.md by .github/workflows/docs.yml, with the version of the module.
  { "Changelog" = "changelog.md" },
]

[project.extra]
alternate = [
  { name = "English", link = "https://jm2k69.github.io/PSGPOTools/en/", lang = "en" },
  { name = "Français", link = "https://jm2k69.github.io/PSGPOTools/fr/", lang = "fr" },
]

[project.theme]
# The logo of HGPM in the header of the site, and as the icon of its tabs (docs/assets/logo).
logo = "assets/logo/hgpm.png"
favicon = "assets/logo/favicon.png"
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
# The scripts of docs/assets/scripts shown in the pages (--8<--), from the root of the repository.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
